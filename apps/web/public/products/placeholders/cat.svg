<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 1200" role="img" aria-label="Pawsome">
  <!-- Brand tile shown until the product photo arrives: pet-tinted, a faint paw pattern, one badge. -->
  <defs>
    <g id="paw">
      <ellipse cx="0" cy="60" rx="95" ry="80"/>
      <ellipse cx="-112" cy="-42" rx="35" ry="48" transform="rotate(-20 -112 -42)"/>
      <ellipse cx="-45" cy="-102" rx="35" ry="50" transform="rotate(-6 -45 -102)"/>
      <ellipse cx="45" cy="-102" rx="35" ry="50" transform="rotate(6 45 -102)"/>
      <ellipse cx="112" cy="-42" rx="35" ry="48" transform="rotate(20 112 -42)"/>
    </g>
    <pattern id="paws" width="240" height="240" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <g fill="#6D28D9" opacity="0.1">
        <use xlink:href="#paw" href="#paw" transform="translate(60 60) scale(0.2)"/>
        <use xlink:href="#paw" href="#paw" transform="translate(180 180) scale(0.2) rotate(180)"/>
      </g>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1200" fill="#EDE9FE"/>
  <rect width="1200" height="1200" fill="url(#paws)"/>
  <circle cx="600" cy="600" r="460" fill="url(#glow)"/>
  <circle cx="600" cy="600" r="236" fill="#8B5CF6" opacity="0.18"/>
  <circle cx="600" cy="600" r="210" fill="#FFFFFF"/>
  <use xlink:href="#paw" href="#paw" transform="translate(600 610) scale(0.78)" fill="#8B5CF6"/>
</svg>
